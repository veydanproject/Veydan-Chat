[package]
name = "veydanchat"
version = "5.2.1"
description = "Chat over Nostr: direct messages and groups, end-to-end encrypted"
authors = ["Veydan Project"]
edition = "2021"
license-file = "../../LICENSE"
publish = false

[lib]
# One library for every platform: desktop main.rs and the Android bootstrap load it.
name = "veydan_chat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# The demo data in a release build (the screenshots): veydan-shell's feature.
demo = ["veydan-shell/demo"]
# The web inspector in a release build (the iOS lab, mode device-inspect):
# Safari or pymobiledevice3 reaches the webview of the phone.
devtools = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# The JNI exports of the engine of calls on Android (apps/*/build.rs).
veydan-build-cfg = { path = "../../crates/build-cfg" }

# The product crate names what tauri-build and generate_context! read
# (internal/platform-spec.md 5.5): tauri with the features of its config,
# serde_json for the `plugins` section, every plugin its capabilities name.
[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
# The module contract, the command router, the app builder, the tray frame.
veydan-shell = { path = "../../crates/shell" }
# The module Messenger: the adapter of the messenger crates (internal/messenger-spec.md).
veydan-messenger-app = { path = "../../crates/messenger-app" }
# The module Communities: the channels, on with the messenger (internal/communities-stage1.md).
veydan-communities = { path = "../../crates/communities" }
# The module Cloud: Veydan Cloud, opened from the settings (internal/vcloud-plan.md 2.2).
veydan-cloud = { path = "../../crates/cloud" }

# ── Desktop only: the plugins the shell registers ────────────────────────────
[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dependencies]
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
# Open http(s) links in the system browser without going through a shell
tauri-plugin-opener = "2"

# ── Mobile only ──────────────────────────────────────────────────────────────
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
# The phone's side of a call (a Kotlin library on Android, a Swift package
# on iOS), which the module of the messenger registers; named here because
# tauri-build finds the library of a plugin through the direct dependencies
# of the product crate.
tauri-plugin-veydan-call = { path = "../../crates/tauri-plugin-veydan-call" }
# Push notifications of the messenger (FCM on Android, APNs on iOS): token,
# permission, taps; on Android also showing a push while the app is not
# running. The module of the messenger registers it; named here for the
# same reason.
tauri-plugin-veydan-push = { path = "../../crates/tauri-plugin-veydan-push" }
# The phone's gallery in the sheet of the paperclip (Kotlin on Android,
# Swift on iOS), which the module of the messenger registers; named here for
# the same reason.
tauri-plugin-veydan-media = { path = "../../crates/tauri-plugin-veydan-media" }
# Open http(s) links in the system browser (a link of a message on a phone too).
tauri-plugin-opener = "2"
# The camera reads the QR code of a new device ("Add a device"); the module
# of the cloud registers the plugin, the product names it for its permissions.
tauri-plugin-barcode-scanner = "2"
# Native file picker (content:// URIs) and fd-based reads of those URIs.
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

